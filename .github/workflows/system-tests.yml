name: System Tests

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: 'Java version to use'
        required: true
        type: string
        default: '17'
      test-pattern:
        description: 'Test class filter (e.g., *BounceST*). Leave empty to run all system tests.'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Timeout in minutes'
        required: true
        type: number
        default: 120

  issue_comment:
    types: [created]

concurrency:
  group: system-tests
  cancel-in-progress: false

jobs:
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/run-system-tests'))
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check permission for PR comment trigger
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
            --jq '.permission')
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
            echo "::error::User ${{ github.event.comment.user.login }} does not have write access."
            exit 1
          fi

      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket' --silent

      - name: Resolve PR head SHA
        if: github.event_name == 'issue_comment'
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          PR_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Resolve inputs
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "sha=${{ steps.pr-info.outputs.sha }}" >> "$GITHUB_OUTPUT"
            echo "java-version=17" >> "$GITHUB_OUTPUT"
            echo "timeout=120" >> "$GITHUB_OUTPUT"
            # Parse optional arguments from the comment body: /run-system-tests [test-pattern]
            COMMENT_BODY="${{ github.event.comment.body }}"
            TEST_PATTERN=$(echo "$COMMENT_BODY" | sed -n 's|^/run-system-tests[[:space:]]*||p' | xargs)
            echo "test-pattern=$TEST_PATTERN" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "java-version=${{ inputs.java-version }}" >> "$GITHUB_OUTPUT"
            echo "timeout=${{ inputs.timeout }}" >> "$GITHUB_OUTPUT"
            echo "test-pattern=${{ inputs.test-pattern }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ steps.resolve.outputs.java-version }}
          gradle-cache-read-only: true

      - name: Build release tarball
        run: |
          ./gradlew --build-cache --no-scan -PcommitId=xxxxxxxxxxxxxxxx :core:releaseTarGz

      - name: Build Docker image
        run: |
          TARBALL=$(find core/build/distributions -name 'kafka_*.tgz' | head -1)
          cp "$TARBALL" docker/jvm/kafka.tgz
          docker build -t apache/kafka:latest --no-cache docker/jvm

      - name: Run System Tests
        id: system-test
        env:
          TIMEOUT_MINUTES: ${{ steps.resolve.outputs.timeout }}
          TEST_PATTERN: ${{ steps.resolve.outputs.test-pattern }}
        run: |
          set +e
          ./.github/scripts/thread-dump.sh &

          GRADLE_CMD="./gradlew --build-cache --continue --no-scan \
            -PtestLoggingEvents=started,passed,skipped,failed \
            -PmaxParallelForks=1 \
            -PcommitId=xxxxxxxxxxxxxxxx \
            :systemtests:systemTest"

          if [[ -n "$TEST_PATTERN" ]]; then
            GRADLE_CMD="$GRADLE_CMD --tests $TEST_PATTERN"
          fi

          timeout "${TIMEOUT_MINUTES}m" $GRADLE_CMD
          exitcode="$?"
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

      - name: Archive JUnit HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        id: archive-junit-html
        with:
          name: system-test-reports
          path: |
            **/build/reports/tests/*
          compression-level: 9
          if-no-files-found: ignore

      - name: Archive JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-xml
          path: |
            **/build/test-results/**/TEST-*.xml
          compression-level: 9
          if-no-files-found: ignore

      - name: Archive Thread Dumps
        if: steps.system-test.outputs.exitcode == '124'
        uses: actions/upload-artifact@v4
        with:
          name: system-test-thread-dumps
          path: |
            thread-dumps/*
          compression-level: 9
          if-no-files-found: ignore

      - name: Parse JUnit tests
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          JUNIT_REPORT_URL: ${{ steps.archive-junit-html.outputs.artifact-url }}
          GRADLE_TEST_EXIT_CODE: ${{ steps.system-test.outputs.gradle-exitcode }}
        run: |
          python .github/scripts/junit.py \
            --path build/junit-xml >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Post result to PR
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.system-test.outputs.exitcode }}
          REPORT_URL: ${{ steps.archive-junit-html.outputs.artifact-url }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr-number }}
        run: |
          if [[ "$EXIT_CODE" == "0" ]]; then
            STATUS="passed"
            EMOJI=":white_check_mark:"
          elif [[ "$EXIT_CODE" == "124" ]]; then
            STATUS="timed out"
            EMOJI=":alarm_clock:"
          else
            STATUS="failed"
            EMOJI=":x:"
          fi

          BODY="${EMOJI} **System tests ${STATUS}**"
          BODY="${BODY}\n\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ -n "$REPORT_URL" ]]; then
            BODY="${BODY}\n**Reports:** ${REPORT_URL}"
          fi

          echo -e "$BODY" | gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file -
